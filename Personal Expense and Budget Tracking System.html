<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Expense and Budget Tracking System</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--text:#17211e;--muted:#5d6b66;--line:#d9e0dd;--accent:#0f6b57;--on:#fff;--bad:#b3261e;--good:#1a7f45}
@media (prefers-color-scheme:dark){:root{--bg:#101614;--card:#19211e;--text:#e7eeeb;--muted:#9aaba5;--line:#2d3935;--accent:#4cc2a4;--on:#08201a;--bad:#ff8a80;--good:#6fd696}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
header{background:var(--accent);color:var(--on);padding:24px 16px;text-align:center}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0}
main{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:16px}
section,.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{margin:0 0 12px;font-size:1.1rem}
.stats,.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat span{color:var(--muted);font-size:.9rem}.stat strong{display:block;font-size:1.4rem}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input,select,button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);min-width:0}
button{background:var(--accent);color:var(--on);border:0;cursor:pointer;align-self:end}
button.del{background:transparent;color:var(--bad);border:1px solid var(--line);padding:4px 10px}
progress{width:100%;height:14px;accent-color:var(--accent)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.in{color:var(--good)}.out,.warn{color:var(--bad)}
#msg{min-height:1.5em;margin:8px 0 0}
footer{text-align:center;color:var(--muted);padding:16px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>Personal Expense and Budget Tracking System</h1>
  <p>C Programming Capstone Project</p>
</header>
<main>
  <div class="stats">
    <div class="stat"><span>Total Income</span><strong class="in" id="income"></strong></div>
    <div class="stat"><span>Total Expenses</span><strong class="out" id="expenses"></strong></div>
    <div class="stat"><span>Balance</span><strong id="balance"></strong></div>
  </div>

  <section>
    <h2>Add Transaction</h2>
    <form id="addForm" class="form">
      <label>Type<select id="type"><option>Expense</option><option>Income</option></select></label>
      <label>Category<input id="category" maxlength="29" required placeholder="Food, Travel, Salary"></label>
      <label>Amount (Rs.)<input id="amount" type="number" min="0.01" step="0.01" required></label>
      <label>Date<input id="date" type="date" required></label>
      <label>Description<input id="description" maxlength="99"></label>
      <button>Add Transaction</button>
    </form>
    <p id="msg" role="status"></p>
  </section>

  <section>
    <h2>Monthly Budget</h2>
    <form id="budgetForm" class="form">
      <label>Month<input id="month" type="month" required></label>
      <label>Budget (Rs.)<input id="budget" type="number" min="0" step="0.01" required></label>
      <button>Save Budget</button>
    </form>
    <p id="budgetText"></p>
    <progress id="bar" max="100" value="0" aria-label="Budget used"></progress>
  </section>

  <section>
    <h2>Transactions</h2>
    <div class="wrap">
      <table>
        <thead><tr><th>ID</th><th>Type</th><th>Category</th><th>Amount</th><th>Date</th><th>Description</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty">No transactions found.</p>
  </section>
</main>
<footer>Data is saved in this browser only.</footer>

<script>
const MAX = 100;
const $ = id => document.getElementById(id);

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch (e) { return fallback; }
}
function save() {
  try {
    localStorage.setItem("transactions", JSON.stringify(transactions));
    localStorage.setItem("budget", JSON.stringify(budget));
  } catch (e) { $("msg").textContent = "Warning: this browser could not save your data."; }
}

let transactions = load("transactions", []);
let budget = load("budget", 0);

const money = n => "Rs. " + n.toFixed(2);
const total = list => list.reduce((sum, t) => sum + t.amount, 0);
const nextID = () => transactions.reduce((m, t) => Math.max(m, t.id), 0) + 1;

function render() {
  const income = total(transactions.filter(t => t.type === "Income"));
  const expenses = total(transactions.filter(t => t.type === "Expense"));
  $("income").textContent = money(income);
  $("expenses").textContent = money(expenses);
  $("balance").textContent = money(income - expenses);

  const month = $("month").value;
  const used = total(transactions.filter(t => t.type === "Expense" && t.date.startsWith(month)));
  const over = budget > 0 && used > budget;
  $("budgetText").textContent = "Budget: " + money(budget) + " | Used: " + money(used) +
    " | Remaining: " + money(budget - used) + (over ? " | Warning: Monthly budget exceeded!" : "");
  $("budgetText").className = over ? "warn" : "";
  $("bar").value = budget > 0 ? Math.min(100, used / budget * 100) : 0;

  $("rows").replaceChildren(...transactions.map(t => {
    const tr = document.createElement("tr");
    const date = t.date.split("-").reverse().join("-");
    [t.id, t.type, t.category, money(t.amount), date, t.description].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });
    tr.children[1].className = t.type === "Income" ? "in" : "out";
    const button = document.createElement("button");
    button.className = "del";
    button.textContent = "Delete";
    button.onclick = () => {
      transactions = transactions.filter(x => x.id !== t.id);
      save();
      $("msg").textContent = "Transaction deleted successfully!";
      render();
    };
    tr.appendChild(document.createElement("td")).appendChild(button);
    return tr;
  }));
  $("empty").hidden = transactions.length > 0;
}

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const amount = Number($("amount").value);
  const category = $("category").value.trim();
  if (transactions.length >= MAX) { $("msg").textContent = "Transaction limit reached!"; return; }
  if (!category || !(amount > 0)) { $("msg").textContent = "Enter a category and an amount above zero."; return; }
  transactions.push({
    id: nextID(), type: $("type").value, category, amount,
    date: $("date").value, description: $("description").value.trim()
  });
  $("msg").textContent = "Transaction added successfully!";
  save();
  ["category", "amount", "description"].forEach(id => $(id).value = "");
  render();
});

$("budgetForm").addEventListener("submit", e => {
  e.preventDefault();
  budget = Number($("budget").value);
  save();
  render();
});
$("month").addEventListener("change", render);

const now = new Date();
const today = new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
$("date").value = today;
$("month").value = today.slice(0, 7);
$("budget").value = budget || "";
render();
</script>
</body>
</html>
